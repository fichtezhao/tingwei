<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Message Board</title>
</head>
<body>
    <h1>Message Board</h1>

    <table border="1px solid black" padding="20px">
        <tr> 
            <th>ID</th>
            <th>Username</th>
            <th>Email</th>
            <th>Message</th>
        </tr>
        {% for item in records %}
        <tr>
            <td>{{ item[0] }}</td>
            <td>{{ item[1] }}</td>
            <td>{{ item[2] }}</td>
            <td>{{ item[3] }}</td>
        </tr>
        {% endfor %}
    </table>

    <p><a href="{{ url_for('index') }}">Back to Home page</a></p>
    
</body>
</html>
